<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7C3AED" />
    <meta name="description" content="个人成长打卡与积分记录" />
    <link rel="icon" href="/logo.jpg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="成长记录" />
    <title>成长记录</title>
    <style>
      /* 启动画屏（Splash）内联样式：保证 JS 跑前已可见，避免白屏冷启动 */
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: linear-gradient(135deg, #6D28D9 0%, #7C3AED 35%, #06B6D4 100%);
        color: #ffffff;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #6D28D9 0%, #7C3AED 35%, #06B6D4 100%);
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #splash.splash-hide { opacity: 0; visibility: hidden; pointer-events: none; }
      .splash-logo {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        background: #7C3AED;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        font-weight: 700;
        box-shadow: 0 8px 24px rgba(124, 58, 237, 0.3);
        animation: splashPulse 1.6s ease-in-out infinite;
      }
      .splash-title {
        margin-top: 16px;
        font-size: 17px;
        font-weight: 600;
        color: #ffffff;
        letter-spacing: 2px;
      }
      .splash-tip {
        margin-top: 8px;
        font-size: 12px;
        color: rgba(255,255,255,0.7);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .splash-dots { display: inline-flex; gap: 4px; }
      .splash-dots span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #ffffff;
        opacity: 0.35;
        animation: dotBlink 1.2s infinite;
      }
      .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); box-shadow: 0 8px 24px rgba(124, 58, 237, 0.3); }
        50% { transform: scale(1.06); box-shadow: 0 12px 32px rgba(124, 58, 237, 0.5); }
      }
      @keyframes dotBlink {
        0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
        40% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <!-- WCAG：键盘用户可跳过导航直达主内容 -->
    <a href="#app" class="skip-link">跳到主要内容</a>

    <!-- 启动画屏（Splash）：在 JS 启动前已可见，避免「冷启动白屏」误以为是错误。
         JS 启动后由 main.js 在 mount 完成时移除 <#splash>。
         设计：品牌色 Logo + 脉冲动画 + 跳动点 + 趣味文案 -->
    <div id="splash" role="status" aria-label="正在打开">
      <div class="splash-logo">成</div>
      <div class="splash-title">成长记录</div>
      <div class="splash-tip">
        <span>小助手正在准备</span>
        <span class="splash-dots"><span></span><span></span><span></span></span>
      </div>
    </div>

    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>
    <script>
      // 【关键】skip-link 默认隐藏（Vite 构建会剥离内联 style/前置 script，
      //        故在此存活脚本中注入，确保冷启动时不裸露「跳到主要内容」）
      (function(){
        var ss = document.createElement('style');
        ss.textContent = '.skip-link{position:absolute;left:-9999px;top:0;padding:8px 16px;background:#7C3AED;color:#fff;z-index:9999;font-size:14px;text-decoration:none;border-radius:4px}.skip-link:focus{left:16px;top:16px}';
        document.head.insertBefore(ss, document.head.firstChild);
      })();

      // 注册 Service Worker（PWA 离线能力）
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((e) => console.warn('[sw] register failed:', e));
        });
      }
      // 注入主题偏好到 <html>，供 tokens.css 的 [data-theme] 选择器即时生效
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
            var sp0 = document.getElementById('splash'); if (sp0) sp0.setAttribute('data-theme', 'dark');
          }
        } catch (_) {}
      })();

      // ===== 启动画屏（Splash）移除：与 Vue 挂载成败彻底解耦 =====
      // 设计原则：Splash 只应「短暂出现」，绝不可因 JS 异常/挂载失败而永久盖住页面。
      // 因此提供三层移除通道：
      //   1) main.js 在 app.mount 成功后调用 window.__removeSplash()（最快，正常路径）
      //   2) window 'load' 事件兜底（资源全部就绪时）
      //   3) 硬超时兜底（最大 2.5s，哪怕 JS 完全崩溃也强制淡出，露出页面内容）
      function __forceHideSplash() {
        var sp = document.getElementById('splash');
        if (!sp) return;
        if (sp.dataset.hiding) return;           // 防重复
        sp.dataset.hiding = '1';
        sp.classList.add('splash-hide');          // 触发 CSS 淡出
        setTimeout(function () {
          if (sp && sp.parentNode) sp.parentNode.removeChild(sp);
        }, 400);
      }
      // 暴露给 main.js（正常路径调用，带最小展示时长逻辑）
      window.__removeSplash = function () { __forceHideSplash(); };
      // 兜底 2：所有资源加载完成（含 JS bundle）即视为可移除
      window.addEventListener('load', function () { setTimeout(__forceHideSplash, 600); });
      // 兜底 3：硬超时——哪怕 JS 完全没跑起来，也不让 Splash 永久遮挡内容
      setTimeout(__forceHideSplash, 2500);
    </script>
  </body>
</html>
