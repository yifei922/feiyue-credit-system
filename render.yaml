# Render 部署配置（Blueprint 模式）
# 冷启动优化：免费层 15min 无请求自动休眠，详见 docs/KEEP-ALIVE.md
services:
  - type: web
    name: feiyue-credit
    runtime: node
    plan: free
    envVars:
      # ── 运行环境 ──
      - key: NODE_ENV
        value: production
      # ── JWT 签名（Render 自动生成，每次部署不变）──
      - key: JWT_SECRET
        generateValue: true
      # ── 数据库（腾讯云 CloudBase SQL 数据库 · 公网地址）──
      # 来源：CloudBase 控制台 → zq123466 环境 → SQL型数据库 → 连接信息
      # 注意：端口是 21210（非默认 3306）；云数据库公网连接不支持 SSL，已移除 DB_SSL
      - key: DB_HOST
        value: sh-cynosdbmysql-grp-0o7o6uce.sql.tencentcdb.com
      - key: DB_PORT
        value: "21210"
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: "FyCredit#2026@Ab9"
      - key: DB_NAME
        value: credit
      # ── 微信小程序凭证（网页端登录/回调需要）──
      - key: WX_APP_ID
        value: wx64664e7fa8d4f747
      - key: WX_APP_SECRET
        value: de8898c3212be995d07661294158c57a
      # ── 积分规则 ──
      - key: INIT_POINTS
        value: "100"
    # 构建前端 + 安装后端依赖
    buildCommand: cd frontend && npm install --include=dev && npx vite build --mode server && cd ../server && npm install
    # 启动服务
    startCommand: cd server && node src/index.js
    # 健康检查：Express 在监听端口后立即响应，加速 Render 判定"已就绪"
    healthCheckPath: /api/health
    # 单实例（免费层上限）
    numInstances: 1
